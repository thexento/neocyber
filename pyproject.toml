[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neocyber"
version = "0.1.0"
description = "Cybersecurity AI Harness for Local Models"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
]

[project.scripts]
neocyber = "neocyber.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
